code: dca
name: "BMAD DEPT Code Agent"
header: "BMAD DEPT Code Agent: Multi-agent AI suite for Adobe + Java middleware"
subheader: "Code audit, generation, impact analysis, sonar scan, test coverage, requirements authoring, and architecture design for AEMaaCS/AMS, Commerce PaaS/SaaS, App Builder, Sling-12/Shaft, Spring Boot, and EDS"
description: "Multi-agent AI suite (audit, generation, impact, sonar scan, test coverage, requirements, architecture) for AEMaaCS/AMS, Adobe Commerce PaaS + SaaS, Adobe App Builder, Sling-12/Shaft, Spring Boot, EDS, and EDS+Commerce"
default_selected: true
recommendedModules: [bmm]
requiredModules: [core]

agents:
  - code: bmad-dept-code-audit-agent
    name: Auditor
    title: Code Audit Specialist
    icon: "🔍"
    description: "Enterprise code auditor. Deterministic tree-sitter AST + regex static analysis and AI-driven semantic analysis across AEMaaCS/AMS, Commerce PaaS/SaaS, Adobe App Builder, Sling-12/Shaft, Spring Boot, and EDS (+ EDS+Commerce). Emits a standardized Excel report + CHANGE-LOG."
    team: software-development

  - code: bmad-dept-code-generation-agent
    name: Generator
    title: Code Generation Specialist
    icon: "⚡"
    description: "Deterministic scaffolders + LLM/MCP generation for AEMaaCS/AMS, Commerce PaaS/SaaS, Adobe App Builder, Sling-12/Shaft, Spring Boot, and EDS — production-ready code following each platform's standards and security patterns."
    team: software-development

  - code: bmad-dept-code-impact-analysis-agent
    name: Impact Analyst
    title: Code Impact Analysis Specialist
    icon: "💥"
    description: "Impact analysis from a Proofhub bug export or a BRD document (Word/Markdown). Traces impacted code, computes reverse-dependency blast radius, and scores risk across all supported stacks; emits an Input-Traceability report."
    team: software-development

  - code: bmad-dept-code-test-coverage-agent
    name: Test Coverage
    title: Test Coverage Specialist
    icon: "🧪"
    description: "Two-tier test coverage. Tier 1: gap analysis + real line/branch coverage (JaCoCo/Istanbul/Clover/LCOV). Tier 2: LLM test generation to 100% per framework (JUnit + AEM/Sling Mocks, Spring Test/MockMvc, PHPUnit/MFTF, Jest)."
    team: software-development

  - code: bmad-dept-code-sonar-scan-agent
    name: Sonar Scanner
    title: Code Quality Scan Specialist
    icon: "🛡️"
    description: "LLM-driven SonarQube-style code quality analysis across all 8 stacks. Covers Bugs, Vulnerabilities, Security Hotspots, Code Smells, Duplications, and Complexity. Produces Reliability/Security/Maintainability ratings (A–E), a pass/fail Quality Gate, and a dedicated Vulnerabilities Excel sheet with color-coded severity rows and concrete recommended fixes."
    team: software-development

  - code: bmad-dept-code-requirements-agent
    name: Requirements
    title: Requirements Authoring Specialist
    icon: "📋"
    description: "Authors BRDs, user stories, and acceptance criteria from a natural-language product description. Parses existing BRDs and enriches. Emits Epic → Story → AC traceability across all 8 supported stacks."
    team: software-development

  - code: bmad-dept-code-architecture-agent
    name: Architecture
    title: Architecture Design Specialist
    icon: "🏛️"
    description: "Authors ADRs, HLD/LLD, API contracts (OpenAPI/GraphQL), C4 + sequence diagrams (Mermaid), STRIDE threat models, and data models from a natural-language design question. Parses existing designs and enriches. Grounded in per-stack Adobe/JVM idioms across all 8 supported stacks."
    team: software-development

# Configuration variables
audit_output:
  prompt: "Where should audit reports be stored?"
  default: "{output_folder}/audit-reports"
  result: "{project-root}/{value}"

audit_engine:
  prompt: "Default audit engine (auto-detects if not set)?"
  default: "auto"
  single-select: ["auto", "aem", "commerce", "commerce-paas", "commerce-saas", "sling", "spring", "app-builder", "eds", "eds-commerce"]

default_role:
  prompt: "Which role best matches how you'll use this plugin? (leave blank to be asked on first activation)"
  default: ""
  single-select: ["", "ea", "tl", "de", "qa", "devops", "security", "pm", "ba", "migration", "content"]

audit_namespace:
  prompt: "Custom module namespace for Commerce projects?"
  default: "Custom"

generation_output:
  prompt: "Where should scaffold + generation reports be stored?"
  default: "{output_folder}/generation-reports"
  result: "{project-root}/{value}"

impact_output:
  prompt: "Where should impact analysis reports be stored?"
  default: "{output_folder}/impact-reports"
  result: "{project-root}/{value}"

test_coverage_output:
  prompt: "Where should test coverage reports be stored?"
  default: "{output_folder}/test-coverage-reports"
  result: "{project-root}/{value}"

sonar_output:
  prompt: "Where should sonar-scan reports be stored?"
  default: "{output_folder}/sonar-reports"
  result: "{project-root}/{value}"

requirements_output:
  prompt: "Where should requirements reports and BRDs be stored?"
  default: "{output_folder}/requirements-reports"
  result: "{project-root}/{value}"

architecture_output:
  prompt: "Where should architecture design reports and artifacts be stored?"
  default: "{output_folder}/architecture-reports"
  result: "{project-root}/{value}"

directories:
  - "{audit_output}"
  - "{generation_output}"
  - "{impact_output}"
  - "{test_coverage_output}"
  - "{sonar_output}"
  - "{requirements_output}"
  - "{architecture_output}"
  - ".bmad"

post-install-notes: |
  BMAD DEPT Code Agent installed (audit · generation · impact · sonar-scan · test-coverage · requirements · architecture).

  Quick usage:
    Ask: "audit my project", "generate a component", "analyze impact of these bugs",
         "sonar scan my project", "analyze test coverage", "author requirements /
         write a BRD", or "design the architecture / author an ADR" — the agent
         auto-detects the stack.

  Install dependencies (Node.js v20.12+):
    # the shared foundation (required by every agent) FIRST:
    cd .claude/skills/shared && npm install
    # then each agent you use:
    cd .claude/skills/bmad-dept-code-audit-agent/scripts && npm install
    cd .claude/skills/bmad-dept-code-sonar-scan-agent/scripts && npm install

  Tier 1 (deterministic scanner), e.g. audit:
    npx ts-node .claude/skills/bmad-dept-code-audit-agent/scripts/run.ts --path .

  Sonar scan (LLM Step 1 → ingest Step 2):
    # Step 1: ask the AI agent "sonar scan my project" — produces sonar-findings.json
    # Step 2: npx ts-node .claude/skills/bmad-dept-code-sonar-scan-agent/scripts/run.ts --ingest sonar-findings.json --path .

  Stacks (auto-detected): aem, commerce, commerce-saas, sling, spring, app-builder, eds, eds-commerce.
  Tier 2 (AI deep analysis) triggers automatically when you ask the agent to run.

  Role adaptation:
    Every agent adapts mode default, output shape, and recommended follow-ups to your role.
    Roles: ea, tl, de, qa, devops, security, pm, ba, migration, content (or generic).
    Set it on first activation (interactive), via the `--role=<code>` flag on any run,
    or up-front via the `default_role` install-time config var above.
    Persisted at `.bmad/role.yaml` in the project root.
    Full catalog and per-role adaptations: `skills/shared/role/ROLES.md`.
