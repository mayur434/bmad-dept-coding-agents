# CircleCI pipeline — v{{VERSION}}
# ------------------------------------------------------------------
# Generated by BMAD DCA Release agent. Stack: {{STACK}}.
# Save this file as `.circleci/config.yml`.
# ------------------------------------------------------------------
version: 2.1

# ------------------------------------------------------------------
# Orbs used sparingly — pin versions to avoid drift.
# ------------------------------------------------------------------
orbs:
  node: circleci/node@5.2.0
  # Add stack-specific orbs as needed (aws-cli, gcp-cli, etc.).

# ------------------------------------------------------------------
executors:
  node-jvm:
    docker:
      - image: cimg/openjdk:17.0-node
    resource_class: large
    working_directory: ~/repo

# ------------------------------------------------------------------
commands:
  restore-caches:
    steps:
      - restore_cache:
          keys:
            - v1-deps-{{ checksum "package-lock.json" }}-{{ checksum "pom.xml" }}
            - v1-deps-

  save-caches:
    steps:
      - save_cache:
          key: v1-deps-{{ checksum "package-lock.json" }}-{{ checksum "pom.xml" }}
          paths:
            - node_modules
            - ~/.m2/repository
            - vendor

# ------------------------------------------------------------------
jobs:
  build:
    executor: node-jvm
    steps:
      - checkout
      - restore-caches
      - run:
          name: Install
          command: npm ci --prefer-offline --no-audit
      - run:
          name: Build
          command: {{BUILD_COMMAND}}
          # Per-stack: `mvn -B clean install -Padobe-public` (AEM),
          # `./gradlew clean build -x test` (Spring), etc.
      - save-caches
      - persist_to_workspace:
          root: .
          paths:
            - {{BUILD_ARTIFACT_PATH}}

  test:
    executor: node-jvm
    steps:
      - checkout
      - restore-caches
      - attach_workspace:
          at: .
      - run:
          name: Unit + integration tests
          command: {{TEST_COMMAND}}
      - store_test_results:
          path: {{TEST_RESULTS_PATH}}
      - store_artifacts:
          path: {{COVERAGE_REPORT_PATH}}
          destination: coverage

  security-scan:
    executor: node-jvm
    steps:
      - checkout
      - restore-caches
      - run:
          name: DCA Sonar Scan
          command: |
            npx ts-node .claude/skills/bmad-dept-code-sonar-scan-agent/scripts/run.ts \
              --path . \
              --engine {{ENGINE}} \
              --technical \
              --no-preflight \
              --yes-install \
              --fail-on-overdue
      - store_artifacts:
          path: sonar-scan-reports/
          destination: sonar

  audit-gate:
    executor: node-jvm
    steps:
      - checkout
      - restore-caches
      - run:
          name: DCA Audit (pre-release)
          command: |
            npx ts-node .claude/skills/bmad-dept-code-audit-agent/scripts/run.ts \
              --path . \
              --engine {{ENGINE}} \
              --technical \
              --no-preflight \
              --yes-install \
              --fail-on-overdue
      - run:
          name: DCA Test-Coverage floor
          command: |
            npx ts-node .claude/skills/bmad-dept-code-test-coverage-agent/scripts/run.ts \
              --path . \
              --engine {{ENGINE}} \
              --mode analyze \
              --technical \
              --no-preflight \
              --yes-install

  deploy:
    parameters:
      env:
        type: string
    executor: node-jvm
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Deploy to << parameters.env >>
          command: {{DEPLOY_COMMAND}}
          environment:
            TARGET_ENV: << parameters.env >>

  post-deploy:
    executor: node-jvm
    steps:
      - checkout
      - run:
          name: Smoke test
          command: {{SMOKE_TEST_COMMAND}}
      - run:
          name: Distribute announcement
          command: echo "Copy release-reports/ANNOUNCEMENT.md to Slack/Confluence/email."

# ------------------------------------------------------------------
# Workflows — with manual approval holds for production.
# ------------------------------------------------------------------
workflows:
  release:
    jobs:
      - build:
          filters:
            tags:
              only: /^v.*/
      - test:
          requires: [build]
          filters:
            tags:
              only: /^v.*/
      - security-scan:
          requires: [build]
          filters:
            tags:
              only: /^v.*/
      - audit-gate:
          requires: [test, security-scan]
          filters:
            tags:
              only: /^v.*/
      - deploy:
          name: deploy-stage
          env: stage
          requires: [audit-gate]
          filters:
            tags:
              only: /^v.*/
      - hold-prod:
          type: approval
          requires: [deploy-stage]
          filters:
            tags:
              only: /^v.*/
      - deploy:
          name: deploy-prod
          env: prod
          requires: [hold-prod]
          filters:
            tags:
              only: /^v.*/
      - post-deploy:
          requires: [deploy-prod]
          filters:
            tags:
              only: /^v.*/

# ------------------------------------------------------------------
# Stack-specific customization points
# ------------------------------------------------------------------
# 1. Secrets: define in Project Settings → Environment Variables. Common:
#    DEPLOY_TOKEN, ADOBE_IMS_*, MAGENTO_CLOUD_TOKEN. Use contexts for
#    org-shared secrets.
# 2. Resource class: bump to `xlarge` for heavy Maven builds; downgrade
#    to `medium` for EDS-only projects to save credits.
# 3. Concurrency: CircleCI's `queue` orb handles serial-per-branch
#    deploys if you have multiple concurrent releases.
# 4. Multi-region: parameterize `deploy` further with a `region` param
#    and add one job per region in the workflow.
