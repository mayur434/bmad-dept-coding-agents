# GitHub Actions workflow — v{{VERSION}}
# ------------------------------------------------------------------
# Generated by BMAD DCA Release agent. Stack: {{STACK}}.
# Save this file as `.github/workflows/release.yml`.
# ------------------------------------------------------------------

name: Release — v{{VERSION}}

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. 2.5.0)'
        required: true
      environment:
        description: 'Target env'
        required: true
        default: 'stage'
        type: choice
        options: [stage, prod]

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read
  security-events: write

concurrency:
  group: release-${{ inputs.environment || 'stage' }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}

jobs:
  # ------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for release-notes generation
      # Node — for DCA agents + EDS + App Builder.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # Java — for AEM / Sling / Spring builds. Remove for non-JVM.
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - id: hash
        run: echo "hash=${{ hashFiles('**/package-lock.json', '**/pom.xml', '**/composer.lock') }}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'maven' }
      - name: Build
        run: {{BUILD_COMMAND}}
        # Per-stack: `mvn -B clean install -Padobe-public` (AEM),
        # `./gradlew build` (Spring), `composer install --no-dev && bin/magento setup:di:compile` (Commerce PaaS),
        # `npm ci && npm run build` (EDS / App Builder).
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: {{BUILD_ARTIFACT_PATH}}
          retention-days: 30

  # ------------------------------------------------------------------
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'maven' }
      - name: Unit + integration tests
        run: {{TEST_COMMAND}}
      - name: Coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: {{COVERAGE_REPORT_PATH}}

  # ------------------------------------------------------------------
  security-scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # DCA sonar-scan agent — LLM-driven quality + vuln scan.
      - name: DCA Sonar Scan
        run: |
          npx ts-node .claude/skills/bmad-dept-code-sonar-scan-agent/scripts/run.ts \
            --path . \
            --engine {{ENGINE}} \
            --technical \
            --no-preflight \
            --yes-install \
            --fail-on-overdue
      - name: Upload SARIF (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-report
          path: '**/sonar-*.sarif'

  # ------------------------------------------------------------------
  audit-gate:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # DCA audit agent — pre-release audit; fails on OVERDUE SLA items.
      - name: DCA Audit (pre-release gate)
        run: |
          npx ts-node .claude/skills/bmad-dept-code-audit-agent/scripts/run.ts \
            --path . \
            --engine {{ENGINE}} \
            --technical \
            --no-preflight \
            --yes-install \
            --fail-on-overdue
      # DCA test-coverage floor gate.
      - name: DCA Test-Coverage floor
        run: |
          npx ts-node .claude/skills/bmad-dept-code-test-coverage-agent/scripts/run.ts \
            --path . \
            --engine {{ENGINE}} \
            --mode analyze \
            --technical \
            --no-preflight \
            --yes-install

  # ------------------------------------------------------------------
  deploy:
    needs: [audit-gate, security-scan, test]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'stage' }}
      # Env-level approvals are configured on the environment itself:
      # Repo → Settings → Environments → <env> → Required reviewers.
    strategy:
      matrix:
        include:
          - env: ${{ inputs.environment || 'stage' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build-artifact }
      - name: Deploy to ${{ matrix.env }}
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: {{DEPLOY_COMMAND}}
        # Per-stack: `mvn deploy` (Sling / Spring), `aio app deploy --workspace $WS` (App Builder),
        # `bin/magento deploy:mode:set production && bin/magento setup:upgrade` (Commerce PaaS),
        # `git push origin main` (EDS — merge-to-main triggers edge deploy).

  # ------------------------------------------------------------------
  post-deploy:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test
        run: {{SMOKE_TEST_COMMAND}}
      - name: Wire post-deploy runbook (Operations agent — Phase 3.4)
        run: echo "Operations agent handles post-deploy alerts + runbook."
      - name: Distribute announcement
        run: echo "Copy release-reports/ANNOUNCEMENT.md to Slack/Confluence/email."

# ------------------------------------------------------------------
# Stack-specific customization points
# ------------------------------------------------------------------
# 1. Replace {{BUILD_COMMAND}} / {{TEST_COMMAND}} / {{DEPLOY_COMMAND}} /
#    {{SMOKE_TEST_COMMAND}} with the stack-appropriate commands.
# 2. Secrets: rotate DEPLOY_TOKEN, ADOBE_IMS_*, MAGENTO_CLOUD_TOKEN, etc.
#    per the org's rotation SLA; store in Repo → Settings → Secrets.
# 3. Env matrix: expand `strategy.matrix.include` for multi-region or
#    multi-cluster deploys.
# 4. Concurrency: `cancel-in-progress: false` keeps queued releases
#    serialized per environment.
