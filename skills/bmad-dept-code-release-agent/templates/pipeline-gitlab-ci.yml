# GitLab CI pipeline — v{{VERSION}}
# ------------------------------------------------------------------
# Generated by BMAD DCA Release agent. Stack: {{STACK}}.
# Save this file as `.gitlab-ci.yml` at the repo root.
# ------------------------------------------------------------------

stages:
  - setup
  - build
  - test
  - security-scan
  - audit-gate
  - deploy
  - post-deploy

variables:
  RELEASE_VERSION: "{{VERSION}}"
  NODE_VERSION: "20"
  JAVA_VERSION: "17"

default:
  image: node:20-bullseye
  interruptible: true
  # cache directories per stack: adjust for pom.xml, composer.lock, package-lock.json.
  cache:
    key:
      files:
        - package-lock.json
        - pom.xml
        - composer.lock
    paths:
      - node_modules/
      - .m2/repository/
      - vendor/

# ------------------------------------------------------------------
# Reusable script templates
# ------------------------------------------------------------------
.setup-node: &setup-node
  before_script:
    - node --version
    - npm ci --prefer-offline --no-audit

.setup-jvm: &setup-jvm
  image: maven:3.9-eclipse-temurin-17
  before_script:
    - mvn -B -q -o -v || mvn -B -v

# ------------------------------------------------------------------
setup:
  stage: setup
  script:
    - echo "Release ${RELEASE_VERSION} — pipeline starting on $CI_COMMIT_SHA"
    - git fetch --tags --unshallow || true

# ------------------------------------------------------------------
build:
  stage: build
  <<: *setup-jvm
  script:
    - {{BUILD_COMMAND}}
    # Per-stack: `mvn -B clean install -Padobe-public` (AEM),
    # `./gradlew clean build -x test` (Spring),
    # `composer install --no-dev && bin/magento setup:di:compile` (Commerce PaaS),
    # `npm ci && npm run build` (EDS / App Builder).
  artifacts:
    paths:
      - {{BUILD_ARTIFACT_PATH}}
    expire_in: 30 days

# ------------------------------------------------------------------
test:
  stage: test
  <<: *setup-jvm
  needs: [build]
  script:
    - {{TEST_COMMAND}}
  artifacts:
    when: always
    paths:
      - {{COVERAGE_REPORT_PATH}}
    reports:
      junit:
        - '**/target/surefire-reports/TEST-*.xml'
        - '**/junit.xml'

# ------------------------------------------------------------------
security-scan:
  stage: security-scan
  <<: *setup-node
  needs: [build]
  script:
    # DCA sonar-scan agent — LLM-driven quality + vuln scan.
    - |
      npx ts-node .claude/skills/bmad-dept-code-sonar-scan-agent/scripts/run.ts \
        --path . \
        --engine {{ENGINE}} \
        --technical \
        --no-preflight \
        --yes-install \
        --fail-on-overdue
  artifacts:
    when: always
    reports:
      sast: '**/sonar-*.sarif'

# ------------------------------------------------------------------
audit-gate:
  stage: audit-gate
  <<: *setup-node
  needs: [build, test]
  script:
    # DCA audit agent — pre-release gate.
    - |
      npx ts-node .claude/skills/bmad-dept-code-audit-agent/scripts/run.ts \
        --path . \
        --engine {{ENGINE}} \
        --technical \
        --no-preflight \
        --yes-install \
        --fail-on-overdue
    # DCA test-coverage floor gate.
    - |
      npx ts-node .claude/skills/bmad-dept-code-test-coverage-agent/scripts/run.ts \
        --path . \
        --engine {{ENGINE}} \
        --mode analyze \
        --technical \
        --no-preflight \
        --yes-install
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: on_success
    - when: manual

# ------------------------------------------------------------------
deploy:stage:
  stage: deploy
  environment:
    name: stage
    url: https://stage.example.com
  needs: [audit-gate, security-scan]
  script:
    - {{DEPLOY_COMMAND}}
    # Per-stack: `mvn deploy` (Sling / Spring), `aio app deploy --workspace stage` (App Builder),
    # `bin/magento setup:upgrade && bin/magento cache:flush` (Commerce PaaS),
    # `git push origin main` (EDS).
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

deploy:prod:
  stage: deploy
  environment:
    name: prod
    url: https://www.example.com
  needs: [deploy:stage]
  # Manual approval — GitLab surfaces a "Play" button in the pipeline UI.
  when: manual
  # Protect prod to only allow specific users/groups to run this job.
  # Configure at: Settings → CI/CD → Protected environments.
  script:
    - {{DEPLOY_COMMAND}}
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ------------------------------------------------------------------
post-deploy:
  stage: post-deploy
  needs: [deploy:prod]
  script:
    - {{SMOKE_TEST_COMMAND}}
    - echo "Distribute release-reports/ANNOUNCEMENT.md to Slack/Confluence/email"
    - echo "Operations agent handles post-deploy alerts + runbook (Phase 3.4)"
  when: always

# ------------------------------------------------------------------
# Stack-specific customization points
# ------------------------------------------------------------------
# 1. Secrets: define at Settings → CI/CD → Variables, mark as
#    "Protected" + "Masked". Common: DEPLOY_TOKEN, ADOBE_IMS_CLIENT_ID,
#    ADOBE_IMS_CLIENT_SECRET, MAGENTO_CLOUD_TOKEN, EDS_ADMIN_TOKEN.
# 2. Deploy freeze: use `rules` with `if: '$CI_COMMIT_BRANCH =~ /release/freeze/'`
#    to block deploys during freeze windows.
# 3. Multi-region: duplicate `deploy:prod` per region with `environment:name`
#    prefix (deploy:prod:us / deploy:prod:eu).
# 4. Rollback: add a manual `rollback:prod` job with `when: manual` that
#    checks out the previous tag and re-runs the deploy command.
