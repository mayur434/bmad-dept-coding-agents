# Adobe Cloud Manager pipeline definition — v{{VERSION}}
# ------------------------------------------------------------------
# Generated by BMAD DCA Release agent. Stack: AEM (AEMaaCS / AMS).
#
# This file is a REFERENCE — Cloud Manager pipelines are configured in
# the Cloud Manager UI (Program → Pipelines) using this YAML as the
# authoritative source of truth for the trigger, source branch, quality
# gate overrides, and custom event handlers. Import with:
#   aio cloudmanager:pipeline:update <pipelineId> --file pipeline.yml
# ------------------------------------------------------------------

# Pipeline trigger — set to MANUAL for gated production releases, or
# ON_GIT_CHANGES for continuous stage promotion.
trigger: MANUAL <!-- verify: current trigger enum -->

# Source repository / branch that Cloud Manager watches.
sourceBranch: main

# Environment scope — Cloud Manager maps stage/prod pipelines separately;
# split into two files if you need distinct triggers per env.
environment: production

# ------------------------------------------------------------------
# STAGE — always runs before Prod. Cloud Manager blocks the prod
# promotion until the stage quality-gate passes.
# ------------------------------------------------------------------
stages:
  - name: validate
    # Cloud Manager built-in — runs SonarQube, security tests, and the
    # Cloud Manager quality-gate against the packaged artifact.
    # Thresholds default from the program config; override in the UI.
    # customer.critical = 0 blocks; customer.important <= 10 blocks with override.
    events:
      pre: []
      post:
        # DCA audit gate — fail the pipeline if any HIGH-severity DCA
        # audit finding is unresolved past its SLA.
        - runs: |
            npx ts-node .claude/skills/bmad-dept-code-audit-agent/scripts/run.ts \
              --path . \
              --engine aem \
              --technical \
              --no-preflight \
              --yes-install \
              --fail-on-overdue
        # DCA sonar-scan gate — fail on HIGH vuln residual.
        - runs: |
            npx ts-node .claude/skills/bmad-dept-code-sonar-scan-agent/scripts/run.ts \
              --path . \
              --engine aem \
              --technical \
              --no-preflight \
              --yes-install \
              --fail-on-overdue

  - name: build
    # Cloud Manager built-in — Maven build against ui.apps + ui.content +
    # ui.config, produces the deployable content package.
    events:
      pre: []
      post: []

  - name: deployStage
    events:
      pre:
        # Coverage gate — enforce release-floor coverage on the delta.
        - runs: |
            npx ts-node .claude/skills/bmad-dept-code-test-coverage-agent/scripts/run.ts \
              --path . \
              --engine aem \
              --mode analyze \
              --technical \
              --no-preflight \
              --yes-install
      post:
        # Post-stage smoke test — hit the stage publish + author URLs.
        - runs: curl -sf https://author-stage.example.com/system/console/status-httprequest || exit 1
        - runs: curl -sf https://publish-stage.example.com/ || exit 1

  - name: promoteToProd
    # Manual approval gate — Cloud Manager requires a human approver.
    approvers:
      - {{APPROVER_1}}
      - {{APPROVER_2}}
    events:
      pre:
        # Final DCA audit re-run on the exact commit going to prod.
        - runs: |
            npx ts-node .claude/skills/bmad-dept-code-audit-agent/scripts/run.ts \
              --path . \
              --engine aem \
              --technical \
              --no-preflight \
              --yes-install \
              --fail-on-overdue

  - name: deployProd
    events:
      pre: []
      post:
        # Dispatcher flush — invalidate the publish tier cache after prod deploy.
        - runs: {{DISPATCHER_FLUSH_COMMAND}}
        # Post-deploy smoke test.
        - runs: curl -sf https://www.example.com/ || exit 1
        # Notification — hand off to the Release agent's ANNOUNCEMENT.md
        # distribution channel.
        - runs: echo "Release {{VERSION}} deployed to prod. Distribute ANNOUNCEMENT.md via release-reports/."

# ------------------------------------------------------------------
# Stack-specific customization points
# ------------------------------------------------------------------
# 1. Override Cloud Manager quality-gate thresholds in the Program config
#    (Cloud Manager UI → Program → Config → Quality Rules) — YAML-side
#    override is not supported. <!-- verify: current API surface -->
# 2. RDE (Rapid Development Environment) deploy is a separate pipeline
#    trigger (`aio cloudmanager:rde:deploy`) — not wired here; add as a
#    pre-stage smoke deploy for release candidates.
# 3. Content-package deploy order is Cloud-Manager-managed: `ui.config`
#    (immutable OSGi config) → `ui.apps` (immutable code) → `ui.content`
#    (mutable content). Do NOT hand-roll this ordering.
# 4. For AMS (Managed Services), replace Cloud Manager with the AMS
#    Jenkins-based pipeline — see `templates/pipeline-jenkins.groovy`.
