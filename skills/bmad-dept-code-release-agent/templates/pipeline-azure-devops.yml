# Azure DevOps pipeline — v{{VERSION}}
# ------------------------------------------------------------------
# Generated by BMAD DCA Release agent. Stack: {{STACK}}.
# Save this file as `azure-pipelines.yml` at the repo root.
# ------------------------------------------------------------------

trigger:
  tags:
    include:
      - v*

pr: none

parameters:
  - name: releaseVersion
    displayName: Release version
    type: string
    default: '{{VERSION}}'
  - name: targetEnv
    displayName: Target environment
    type: string
    default: 'stage'
    values: [stage, prod]

variables:
  - name: nodeVersion
    value: '20.x'
  - name: javaVersion
    value: '17'
  - group: dca-release-secrets   # Variable group; define at Library → Variable groups.

pool:
  vmImage: 'ubuntu-latest'

# ------------------------------------------------------------------
# Stages — validate → build → test → security → audit → deploy → post
# ------------------------------------------------------------------
stages:
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: buildAndTest
        displayName: 'Build + unit tests'
        steps:
          - checkout: self
            fetchDepth: 0   # full history for release-notes generation

          - task: NodeTool@0
            inputs: { versionSpec: $(nodeVersion) }
            displayName: 'Setup Node'

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: $(javaVersion)
              jdkArchitectureOption: x64
              jdkSourceOption: 'PreInstalled'
            displayName: 'Setup Java'

          - script: |
              {{BUILD_COMMAND}}
            displayName: 'Build'
            # Per-stack: `mvn -B clean install -Padobe-public` (AEM),
            # `./gradlew clean build -x test` (Spring), etc.

          - script: |
              {{TEST_COMMAND}}
            displayName: 'Test'

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/surefire-reports/*.xml,**/junit.xml'

          - task: PublishCodeCoverageResults@2
            condition: always()
            inputs:
              summaryFileLocation: '{{COVERAGE_REPORT_PATH}}'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '{{BUILD_ARTIFACT_PATH}}'
              ArtifactName: 'drop'

  # ------------------------------------------------------------------
  - stage: SecurityScan
    displayName: 'Security scan'
    dependsOn: Build
    jobs:
      - job: sonarScan
        displayName: 'DCA Sonar Scan'
        steps:
          - task: NodeTool@0
            inputs: { versionSpec: $(nodeVersion) }
          - script: |
              npx ts-node .claude/skills/bmad-dept-code-sonar-scan-agent/scripts/run.ts \
                --path . \
                --engine {{ENGINE}} \
                --technical \
                --no-preflight \
                --yes-install \
                --fail-on-overdue
            displayName: 'DCA Sonar Scan'

  # ------------------------------------------------------------------
  - stage: AuditGate
    displayName: 'Audit gate'
    dependsOn: [Build, SecurityScan]
    jobs:
      - job: auditGate
        displayName: 'DCA Audit + Coverage gate'
        steps:
          - task: NodeTool@0
            inputs: { versionSpec: $(nodeVersion) }
          - script: |
              npx ts-node .claude/skills/bmad-dept-code-audit-agent/scripts/run.ts \
                --path . \
                --engine {{ENGINE}} \
                --technical \
                --no-preflight \
                --yes-install \
                --fail-on-overdue
            displayName: 'DCA Audit (pre-release)'
          - script: |
              npx ts-node .claude/skills/bmad-dept-code-test-coverage-agent/scripts/run.ts \
                --path . \
                --engine {{ENGINE}} \
                --mode analyze \
                --technical \
                --no-preflight \
                --yes-install
            displayName: 'DCA Test-Coverage floor'

  # ------------------------------------------------------------------
  - stage: DeployStage
    displayName: 'Deploy → stage'
    dependsOn: AuditGate
    condition: succeeded()
    jobs:
      - deployment: deployStage
        environment: 'stage'   # Environments → stage → approvals & checks.
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop
                - script: |
                    {{DEPLOY_COMMAND}}
                  env:
                    DEPLOY_TOKEN: $(deploy-token-stage)
                  displayName: 'Deploy to stage'

  # ------------------------------------------------------------------
  - stage: DeployProd
    displayName: 'Deploy → prod'
    dependsOn: DeployStage
    condition: and(succeeded(), eq('${{ parameters.targetEnv }}', 'prod'))
    jobs:
      - deployment: deployProd
        environment: 'prod'   # Environments → prod → approvals required.
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop
                - script: |
                    {{DEPLOY_COMMAND}}
                  env:
                    DEPLOY_TOKEN: $(deploy-token-prod)
                  displayName: 'Deploy to prod'

  # ------------------------------------------------------------------
  - stage: PostDeploy
    displayName: 'Post-deploy'
    dependsOn: DeployProd
    condition: always()
    jobs:
      - job: postDeploy
        displayName: 'Smoke + comms'
        steps:
          - script: |
              {{SMOKE_TEST_COMMAND}}
            displayName: 'Smoke test'
          - script: echo "Distribute release-reports/ANNOUNCEMENT.md to Slack/Confluence/email."
            displayName: 'Distribute announcement'
          - script: echo "Operations agent handles post-deploy alerts + runbook (Phase 3.4)."
            displayName: 'Wire post-deploy runbook'

# ------------------------------------------------------------------
# Stack-specific customization points
# ------------------------------------------------------------------
# 1. Secrets: define at Pipelines → Library → Variable groups; mark as
#    "Keep this value secret". Reference via $(varname). Common:
#    deploy-token-stage, deploy-token-prod, adobe-ims-*, magento-cloud-token.
# 2. Environments: define at Pipelines → Environments; wire Approvals &
#    Checks (manual approval, Azure Monitor alerts, business hours,
#    exclusive lock) per env.
# 3. Templates: pull common stage / job YAML into `templates/` and
#    reference with `- template: ../templates/deploy.yml` to DRY multi-stack
#    orgs.
# 4. Multi-region: expand DeployProd into a matrix with region-scoped
#    environments (prod-us, prod-eu).
# 5. Rollback: separate rollback pipeline (`rollback-pipelines.yml`)
#    parameterized on the target version.
