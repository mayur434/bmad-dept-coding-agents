[skill]
name = "bmad-dept-code-audit-agent"
description = "Two-tier code auditor across the 8 supported stacks — AEM (AEMaaCS & AMS), Adobe Commerce (PaaS & SaaS), Apache Sling/Shaft, Spring Boot, Adobe App Builder, EDS, and EDS+Commerce. Tier 1: deterministic TypeScript/Node.js static analysis (tree-sitter AST + regex, zero tokens) emitting the standardized `audit-<branch>-<timestamp>-agent-report.xlsx` + Markdown twin + CHANGE-LOG. Tier 2: LLM-driven deep semantic analysis (architecture, cross-file flows, contextual reasoning)."
version = "2.0.0"

[skill.tools]
# Works with every AI coding tool BMAD Method supports (44+ IDs — Claude Code,
# Cursor, GitHub Copilot, Codex, Cline, Windsurf, Gemini, Roo, Kilo, Amp, and
# more). The plugin is tool-agnostic: SKILL.md is neutral prose, and the
# bootstrap script resolves its own path via `dirname "$0"`, so it works
# under whichever directory BMAD picks (.claude/skills, .agents/skills,
# .cursor/skills, etc.). Discover the full list with
# `npx bmad-method install --list-tools`.
required = ["*"]

[skill.activation]
keywords = ["audit", "code review", "code quality", "adobe audit", "aem audit", "commerce audit", "commerce saas", "eds", "eds commerce", "eds audit", "sling", "spring", "app builder", "code scan", "static analysis", "set role", "switch role", "what's my role", "show my role", "role catalog"]

[skill.scripts]
dispatcher = "scripts/run.ts"
package = "scripts/package.json"

[skill.commands]
# Tier 1: Run deterministic TypeScript scanner (auto-detects platform)
scan = "npx ts-node scripts/run.ts"
# Tier 1 with explicit engine (all 8 registered engines)
scan-commerce = "npx ts-node scripts/run.ts --engine commerce"
scan-commerce-saas = "npx ts-node scripts/run.ts --engine commerce-saas"
scan-aem = "npx ts-node scripts/run.ts --engine aem"
scan-sling = "npx ts-node scripts/run.ts --engine sling"
scan-spring = "npx ts-node scripts/run.ts --engine spring"
scan-app-builder = "npx ts-node scripts/run.ts --engine app-builder"
scan-eds = "npx ts-node scripts/run.ts --engine eds"
scan-eds-commerce = "npx ts-node scripts/run.ts --engine eds-commerce"
# Tier 2: LLM deep analysis (uses rule packs + detection strategy)
deep-audit = "skill"
# Combined: run Tier 1 then Tier 2 on flagged areas
full-audit = "scan+skill"
# Utility
list-engines = "npx ts-node scripts/run.ts --list-engines"
