# NOTE: This is a per-agent copy of the top-level ../../module.yaml.
# The top-level file is authoritative; keep this in sync if BMAD requires it.
# Contains only this agent's own entry.

code: dca
name: "BMAD DEPT Code Agent"

agents:
  - code: bmad-dept-code-generation-agent
    name: Generator
    title: Code Generation Specialist
    icon: "⚡"
    description: "Deterministic scaffolders + LLM/MCP generation for AEMaaCS/AMS, Commerce PaaS/SaaS, Adobe App Builder, Sling-12/Shaft, Spring Boot, and EDS — production-ready code following each platform's standards and security patterns."
    team: software-development

generation_output:
  prompt: "Where should scaffold + generation reports be stored?"
  default: "{output_folder}/generation-reports"
  result: "{project-root}/{value}"

directories:
  - "{generation_output}"
