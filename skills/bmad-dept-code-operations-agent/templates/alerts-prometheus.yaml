# Prometheus alerting rules for {{SERVICE}} on {{STACK}}
# Load via prometheus.yml `rule_files:` (see dashboard-prometheus.yml).
# Delivered by Alertmanager to PagerDuty / Opsgenie / Slack per receiver.
# Generated by BMAD DCA Operations agent.

groups:
  # ── 1. Availability ─────────────────────────────────────────────────
  - name: {{SERVICE}}_availability
    interval: 30s
    rules:
      - alert: {{SERVICE}}InstanceDown
        expr: up{service="{{SERVICE}}", env="{{ENV}}"} == 0
        for: 2m
        labels:
          severity: sev1
          service: {{SERVICE}}
          env: {{ENV}}
        annotations:
          summary: "{{SERVICE}} instance down ({{ '{{' }} $labels.instance {{ '}}' }})"
          description: "Instance {{ '{{' }} $labels.instance {{ '}}' }} of {{SERVICE}} has been unreachable for 2m."
          runbook: "{{RUNBOOK_URL}}#uptime"

  # ── 2. Latency ─────────────────────────────────────────────────────
  - name: {{SERVICE}}_latency
    interval: 30s
    rules:
      - alert: {{SERVICE}}LatencyP99High
        expr: histogram_quantile(0.99, sum(rate({{METRIC_LATENCY_BUCKET}}{service="{{SERVICE}}", env="{{ENV}}"}[5m])) by (le)) > {{SLO_LATENCY_P99_SECONDS}}
        for: 15m
        labels:
          severity: sev2
          service: {{SERVICE}}
          env: {{ENV}}
        annotations:
          summary: "{{SERVICE}} p99 latency > {{SLO_LATENCY_P99_MS}}ms"
          description: "p99 latency has exceeded {{SLO_LATENCY_P99_MS}}ms for 15m."
          runbook: "{{RUNBOOK_URL}}#latency"

  # ── 3. Error rate ──────────────────────────────────────────────────
  - name: {{SERVICE}}_errors
    interval: 30s
    rules:
      - alert: {{SERVICE}}ErrorRateHigh
        expr: |
          100 *
          sum(rate({{METRIC_REQUESTS}}{service="{{SERVICE}}", env="{{ENV}}", status=~"5.."}[5m]))
          /
          sum(rate({{METRIC_REQUESTS}}{service="{{SERVICE}}", env="{{ENV}}"}[5m]))
          > {{SLO_ERROR_RATE_PCT}}
        for: 10m
        labels:
          severity: sev2
          service: {{SERVICE}}
          env: {{ENV}}
        annotations:
          summary: "{{SERVICE}} error rate > {{SLO_ERROR_RATE_PCT}}%"
          runbook: "{{RUNBOOK_URL}}#errors"

  # ── 4. Saturation ──────────────────────────────────────────────────
  - name: {{SERVICE}}_saturation
    interval: 30s
    rules:
      - alert: {{SERVICE}}SaturationHigh
        expr: avg({{METRIC_SATURATION}}{service="{{SERVICE}}", env="{{ENV}}"}) > 90
        for: 15m
        labels:
          severity: sev3
          service: {{SERVICE}}
          env: {{ENV}}
        annotations:
          summary: "{{SERVICE}} {{SATURATION_LABEL}} > 90%"
          runbook: "{{RUNBOOK_URL}}#saturation"

  # ── 5. Log-error rate ──────────────────────────────────────────────
  - name: {{SERVICE}}_logs
    interval: 60s
    rules:
      - alert: {{SERVICE}}LogErrorSpike
        expr: sum(rate({service="{{SERVICE}}", env="{{ENV}}", level="ERROR"}[5m])) > {{LOG_ERROR_SPIKE_RATE}}
        for: 10m
        labels:
          severity: sev3
          service: {{SERVICE}}
          env: {{ENV}}
        annotations:
          summary: "{{SERVICE}} log-error spike"
          runbook: "{{RUNBOOK_URL}}#log-errors"

  # ── 6. SLO burn rate (multi-window multi-burn) ─────────────────────
  - name: {{SERVICE}}_slo_burn
    interval: 30s
    rules:
      - alert: {{SERVICE}}SLOFastBurn
        expr: |
          (
            (1 - slo:availability:ratio_rate1h{service="{{SERVICE}}"}) > (14.4 * (1 - {{SLO_AVAILABILITY}}))
          and
            (1 - slo:availability:ratio_rate5m{service="{{SERVICE}}"}) > (14.4 * (1 - {{SLO_AVAILABILITY}}))
          )
        for: 2m
        labels:
          severity: sev1
          service: {{SERVICE}}
          env: {{ENV}}
          slo_burn: fast
        annotations:
          summary: "{{SERVICE}} SLO fast burn — 2% budget in 1h"
          runbook: "{{RUNBOOK_URL}}#slo-burn"

      - alert: {{SERVICE}}SLOSlowBurn
        expr: |
          (
            (1 - slo:availability:ratio_rate6h{service="{{SERVICE}}"}) > (6 * (1 - {{SLO_AVAILABILITY}}))
          and
            (1 - slo:availability:ratio_rate30m{service="{{SERVICE}}"}) > (6 * (1 - {{SLO_AVAILABILITY}}))
          )
        for: 15m
        labels:
          severity: sev3
          service: {{SERVICE}}
          env: {{ENV}}
          slo_burn: slow
        annotations:
          summary: "{{SERVICE}} SLO slow burn — 5% budget in 6h"
          runbook: "{{RUNBOOK_URL}}#slo-burn"
