# Prometheus scrape + rules skeleton for {{SERVICE}} on {{STACK}}
# Generated by BMAD DCA Operations agent.
#
# Prometheus itself does not render dashboards — visualization lives in
# Grafana (see dashboard-grafana.json). This file wires the scrape jobs
# and points at the alerting rules file (see alerts-prometheus.yaml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: "{{SERVICE}}"
    stack: "{{STACK}}"

rule_files:
  - "alerts-prometheus.yaml"
  # Recording rules — pre-compute SLI numerator/denominator per service.
  - "slo-recording-rules.yaml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "{{ALERTMANAGER_HOST}}:9093"

scrape_configs:
  - job_name: "{{SERVICE}}"
    metrics_path: "{{METRICS_PATH}}"   # e.g. /actuator/prometheus for Spring
    scheme: "{{METRICS_SCHEME}}"
    scrape_interval: 15s
    static_configs:
      - targets: ["{{SERVICE_HOST_1}}:{{METRICS_PORT}}", "{{SERVICE_HOST_2}}:{{METRICS_PORT}}"]
        labels:
          env: "{{ENV}}"
          region: "{{REGION}}"

  - job_name: "node-exporter"
    static_configs:
      - targets: ["{{NODE_EXPORTER_1}}:9100", "{{NODE_EXPORTER_2}}:9100"]

  # blackbox-exporter — synthetic uptime probes for golden-signal availability
  - job_name: "blackbox-http-{{SERVICE}}"
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets:
          - "{{HEALTH_URL}}"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "{{BLACKBOX_EXPORTER_HOST}}:9115"
