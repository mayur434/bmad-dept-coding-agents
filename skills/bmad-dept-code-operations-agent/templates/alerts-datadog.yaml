# Datadog monitors for {{SERVICE}} on {{STACK}}
# Shape: terraform-provider-datadog resource schema
# (https://registry.terraform.io/providers/DataDog/datadog/latest/docs/resources/monitor)
# Apply with: terraform apply -target=datadog_monitor.<name>
# Generated by BMAD DCA Operations agent.

resource:
  # ── 1. Uptime — synthetic HTTP check ──────────────────────────────────
  datadog_monitor:
    "{{SERVICE}}_uptime":
      name: "[{{ENV}}] {{SERVICE}} — Uptime < 99.9%"
      type: "service check"
      query: '"http.can_connect".over("service:{{SERVICE}}","env:{{ENV}}").by("host","instance").last(2).count_by_status()'
      message: |
        {{SERVICE}} on {{ENV}} is DOWN.
        Runbook: {{RUNBOOK_URL}}#uptime
        Escalation: notify @{{ONCALL_PAGERDUTY_INTEGRATION}}
      tags: ["service:{{SERVICE}}", "env:{{ENV}}", "severity:sev1"]
      priority: 1
      monitor_thresholds:
        critical: 1
        warning: 1
        ok: 1
      notify_no_data: true
      no_data_timeframe: 5

    # ── 2. Latency p99 above SLO ────────────────────────────────────────
    "{{SERVICE}}_latency_p99":
      name: "[{{ENV}}] {{SERVICE}} — p99 latency > {{SLO_LATENCY_P99_MS}}ms"
      type: "query alert"
      query: 'avg(last_15m):p99:{{METRIC_LATENCY_BASE}}{service:{{SERVICE}}, env:{{ENV}}} > {{SLO_LATENCY_P99_MS}}'
      message: |
        p99 latency exceeded {{SLO_LATENCY_P99_MS}}ms for 15 min.
        Runbook: {{RUNBOOK_URL}}#latency
        @{{ONCALL_PAGERDUTY_INTEGRATION}}
      tags: ["service:{{SERVICE}}", "env:{{ENV}}", "severity:sev2"]
      priority: 2
      monitor_thresholds:
        critical: {{SLO_LATENCY_P99_MS}}
        warning: {{SLO_LATENCY_P95_MS}}

    # ── 3. Error rate above threshold ───────────────────────────────────
    "{{SERVICE}}_error_rate":
      name: "[{{ENV}}] {{SERVICE}} — error rate > {{SLO_ERROR_RATE_PCT}}%"
      type: "query alert"
      query: 'sum(last_10m):100 * sum:{{METRIC_ERRORS}}{service:{{SERVICE}}, env:{{ENV}}}.as_count() / sum:{{METRIC_REQUESTS}}{service:{{SERVICE}}, env:{{ENV}}}.as_count() > {{SLO_ERROR_RATE_PCT}}'
      message: |
        Error rate exceeded {{SLO_ERROR_RATE_PCT}}% for 10 min.
        Runbook: {{RUNBOOK_URL}}#errors
        @{{ONCALL_PAGERDUTY_INTEGRATION}}
      tags: ["service:{{SERVICE}}", "env:{{ENV}}", "severity:sev2"]
      priority: 2
      monitor_thresholds:
        critical: {{SLO_ERROR_RATE_PCT}}
        warning: {{SLO_ERROR_RATE_WARN_PCT}}

    # ── 4. Saturation — {{SATURATION_LABEL}} ────────────────────────────
    "{{SERVICE}}_saturation":
      name: "[{{ENV}}] {{SERVICE}} — {{SATURATION_LABEL}} > 90%"
      type: "query alert"
      query: 'avg(last_15m):avg:{{METRIC_SATURATION}}{service:{{SERVICE}}, env:{{ENV}}} > 90'
      message: |
        {{SATURATION_LABEL}} saturation exceeded 90% for 15 min.
        Runbook: {{RUNBOOK_URL}}#saturation
        @{{ONCALL_TEAM_SLACK}}
      tags: ["service:{{SERVICE}}", "env:{{ENV}}", "severity:sev3"]
      priority: 3
      monitor_thresholds:
        critical: 90
        warning: 80

    # ── 5. Log-error rate ──────────────────────────────────────────────
    "{{SERVICE}}_log_errors":
      name: "[{{ENV}}] {{SERVICE}} — log-error spike"
      type: "log alert"
      query: 'logs("service:{{SERVICE}} env:{{ENV}} status:error").index("*").rollup("count").last("10m") > {{LOG_ERROR_SPIKE_COUNT}}'
      message: |
        Log-error count exceeded {{LOG_ERROR_SPIKE_COUNT}} in 10 min.
        Investigate via log explorer.
        Runbook: {{RUNBOOK_URL}}#log-errors
        @{{ONCALL_TEAM_SLACK}}
      tags: ["service:{{SERVICE}}", "env:{{ENV}}", "severity:sev3"]
      priority: 3

    # ── 6. SLO error-budget fast burn (2% in 1h) ────────────────────────
    "{{SERVICE}}_slo_fast_burn":
      name: "[{{ENV}}] {{SERVICE}} — SLO fast burn (2% budget/1h)"
      type: "query alert"
      query: 'sum(last_1h):slo_burn_rate:{slo_id:{{SLO_ID}}} > 14.4'
      message: |
        Error budget burning fast — 2% of monthly budget consumed in 1h.
        At this rate the budget exhausts in <2 days.
        Runbook: {{RUNBOOK_URL}}#slo-burn
        @{{ONCALL_PAGERDUTY_INTEGRATION}}
      tags: ["service:{{SERVICE}}", "env:{{ENV}}", "severity:sev1", "type:slo-burn"]
      priority: 1

    # ── 7. SLO error-budget slow burn (5% in 6h) — optional ─────────────
    "{{SERVICE}}_slo_slow_burn":
      name: "[{{ENV}}] {{SERVICE}} — SLO slow burn (5% budget/6h)"
      type: "query alert"
      query: 'sum(last_6h):slo_burn_rate:{slo_id:{{SLO_ID}}} > 6'
      message: |
        Error budget slow-burning — 5% consumed in 6h.
        Runbook: {{RUNBOOK_URL}}#slo-burn
        @{{ONCALL_TEAM_SLACK}}
      tags: ["service:{{SERVICE}}", "env:{{ENV}}", "severity:sev3", "type:slo-burn"]
      priority: 3
