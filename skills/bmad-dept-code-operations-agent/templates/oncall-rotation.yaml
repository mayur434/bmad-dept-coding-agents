# On-call rotation for {{TEAM_NAME}}
# Schema: PagerDuty-compatible (also imports into Opsgenie / VictorOps
# with light massaging). Apply via `pd-cli` or Terraform
# provider-pagerduty.
# Generated by BMAD DCA Operations agent.

schedule:
  name: "{{TEAM_NAME}} — Primary On-Call"
  description: "Primary on-call rotation for {{SERVICE}} ({{STACK}}). Owns first-response to sev1/sev2 alerts. Handoff Monday 10:00 {{TIMEZONE}}."
  time_zone: "{{TIMEZONE}}"                # e.g. America/New_York, Europe/London
  schedule_layers:

    # ── Layer 1: Primary (24/7 weekly rotation) ─────────────────────
    - name: "Primary — weekly"
      start: "{{ROTATION_START_ISO}}"      # e.g. 2026-08-10T10:00:00-05:00
      rotation_virtual_start: "{{ROTATION_START_ISO}}"
      rotation_turn_length_seconds: 604800  # 7 days
      users:
        - "{{PRIMARY_USER_1_ID}}"          # e.g. pagerduty user ID or email
        - "{{PRIMARY_USER_2_ID}}"
        - "{{PRIMARY_USER_3_ID}}"
        - "{{PRIMARY_USER_4_ID}}"
      restrictions:
        - type: "daily_restriction"
          duration_seconds: 86400          # 24h coverage
          start_time_of_day: "00:00:00"

    # ── Layer 2: Secondary (backup for primary) ─────────────────────
    - name: "Secondary — weekly"
      start: "{{ROTATION_START_ISO}}"
      rotation_virtual_start: "{{ROTATION_START_ISO}}"
      rotation_turn_length_seconds: 604800  # 7 days
      users:
        - "{{SECONDARY_USER_1_ID}}"
        - "{{SECONDARY_USER_2_ID}}"
        - "{{SECONDARY_USER_3_ID}}"
      restrictions:
        - type: "daily_restriction"
          duration_seconds: 86400
          start_time_of_day: "00:00:00"

# ── Escalation policy: primary → secondary → EM ─────────────────────
escalation_policy:
  name: "{{TEAM_NAME}} — Escalation"
  description: "Primary → Secondary (10 min) → Engineering Manager (25 min) → Director (60 min)."
  num_loops: 2
  escalation_rules:
    - escalation_delay_in_minutes: 10
      targets:
        - type: "schedule_reference"
          id: "{{PRIMARY_SCHEDULE_ID}}"
    - escalation_delay_in_minutes: 15
      targets:
        - type: "schedule_reference"
          id: "{{SECONDARY_SCHEDULE_ID}}"
    - escalation_delay_in_minutes: 35
      targets:
        - type: "user_reference"
          id: "{{ENGINEERING_MANAGER_ID}}"
    - escalation_delay_in_minutes: 60
      targets:
        - type: "user_reference"
          id: "{{DIRECTOR_ID}}"

# ── Overrides for holidays / PTO ────────────────────────────────────
overrides:
  - schedule_id: "{{PRIMARY_SCHEDULE_ID}}"
    start: "{{HOLIDAY_1_START_ISO}}"
    end: "{{HOLIDAY_1_END_ISO}}"
    user_id: "{{HOLIDAY_1_COVER_USER_ID}}"
    reason: "{{HOLIDAY_1_REASON}}"          # e.g. "Thanksgiving — US team OOO"
  - schedule_id: "{{PRIMARY_SCHEDULE_ID}}"
    start: "{{HOLIDAY_2_START_ISO}}"
    end: "{{HOLIDAY_2_END_ISO}}"
    user_id: "{{HOLIDAY_2_COVER_USER_ID}}"
    reason: "{{HOLIDAY_2_REASON}}"

# ── Handoff conventions ──────────────────────────────────────────────
handoff:
  cadence: "weekly"
  day: "monday"
  time: "10:00"
  timezone: "{{TIMEZONE}}"
  ceremony:
    - "Incoming on-call reads the last-week bridge transcripts."
    - "Outgoing on-call briefs incoming on any in-flight incidents / follow-ups."
    - "Both confirm the alert-noise dashboard is quiet before handoff completes."
    - "Update {{COMMS_CHANNEL}} with '@here handoff complete — on-call is now @incoming'."

# ── Comms integration ────────────────────────────────────────────────
integrations:
  slack:
    channel: "{{COMMS_CHANNEL}}"
    notify_on:
      - "incident_declared"
      - "incident_acknowledged"
      - "incident_escalated"
      - "incident_resolved"
  pagerduty_service:
    id: "{{PAGERDUTY_SERVICE_ID}}"
    routing_key: "{{PAGERDUTY_ROUTING_KEY_ENV_VAR}}"   # store in secrets manager

# ── SLA ──────────────────────────────────────────────────────────────
sla:
  acknowledgement_minutes: 5          # ack within 5 min of page
  resolution_target_minutes: 60       # mitigate within 1h for sev1
