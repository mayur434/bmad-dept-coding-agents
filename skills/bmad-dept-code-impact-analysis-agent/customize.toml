[skill]
name = "bmad-dept-code-impact-analysis-agent"
description = "Code impact analysis for Adobe Commerce (PaaS & SaaS), AEM (AEMaaCS & AMS), Apache Sling/Shaft, Spring Boot, App Builder, EDS, and EDS+Commerce projects. Evaluates blast radius, traces dependency chains, assesses risk for changes, upgrades, and patches."
version = "1.0.0"

[skill.tools]
# Works with every AI coding tool BMAD Method supports (44+ IDs — Claude Code,
# Cursor, GitHub Copilot, Codex, Cline, Windsurf, Gemini, Roo, Kilo, Amp, and
# more). The plugin is tool-agnostic: SKILL.md is neutral prose, and the
# bootstrap script resolves its own path via `dirname "$0"`, so it works
# under whichever directory BMAD picks (.claude/skills, .agents/skills,
# .cursor/skills, etc.). Discover the full list with
# `npx bmad-method install --list-tools`.
required = ["*"]

[skill.activation]
keywords = ["impact", "blast radius", "what breaks", "dependency", "affected", "breaking changes", "upgrade risk", "patch risk", "trace dependencies", "change risk", "aem", "commerce", "commerce saas", "sling", "spring", "app builder", "eds", "eds commerce", "set role", "switch role", "what's my role", "show my role", "role catalog"]

[skill.scripts]
dispatcher = "scripts/run.ts"
package = "scripts/package.json"

[skill.commands]
analyze = "npx ts-node scripts/run.ts"
list-engines = "npx ts-node scripts/run.ts --list-engines"
