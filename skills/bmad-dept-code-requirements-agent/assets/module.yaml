code: dca
name: "BMAD DEPT Code Agent"
header: "BMAD DEPT Code Agent: Multi-agent AI suite for Adobe + Java middleware"
subheader: "Code audit, generation, impact analysis, sonar scan, test coverage, and requirements authoring for AEMaaCS/AMS, Commerce PaaS/SaaS, App Builder, Sling-12/Shaft, Spring Boot, and EDS"
description: "Multi-agent AI suite (audit, generation, impact, sonar scan, test coverage, requirements) for AEMaaCS/AMS, Adobe Commerce PaaS + SaaS, Adobe App Builder, Sling-12/Shaft, Spring Boot, EDS, and EDS+Commerce"

agents:
  - code: bmad-dept-code-requirements-agent
    name: Requirements
    title: Requirements Authoring Specialist
    icon: "📋"
    description: "Authors BRDs, user stories, and acceptance criteria from a natural-language product description. Parses existing BRDs and enriches. Emits Epic → Story → AC traceability across all 8 supported stacks."
    team: software-development

requirements_output:
  prompt: "Where should requirements reports and BRDs be stored?"
  default: "{output_folder}/requirements-reports"
  result: "{project-root}/{value}"
